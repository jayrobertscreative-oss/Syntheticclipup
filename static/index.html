<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clip Studio — Synthetic Clip Up</title>
<link rel="icon" href="/static/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: app shell — fixed brand sidebar (drawer on mobile), top bar, scrolling workspace. Single dark brand look by design. */
:root{
  --bg:#0B0B12; --bg2:#151521; --card:#1C1C2B; --line:#2A2A3D;
  --purple:#7856FF; --blue:#36C8FF; --fg:#FFFFFF; --muted:#A0A0B5;
  --ok:#22C55E; --warn:#F59E0B; --err:#EF4444;
  --grad:linear-gradient(110deg,var(--purple),var(--blue));
  --display:"Sora",ui-sans-serif,system-ui,sans-serif;
  --body:"Inter",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:12px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100%}
.app.collapsed{grid-template-columns:76px 1fr}
/* sidebar */
.side{background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:18px 12px;gap:18px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand img{width:38px;height:38px;border-radius:10px;flex:none;box-shadow:0 0 18px rgba(120,86,255,.35)}
.brand b{font:600 13px/1.15 var(--display);letter-spacing:.14em}
.brand small{display:block;color:var(--muted);font:500 10px var(--mono);letter-spacing:.1em}
nav{display:flex;flex-direction:column;gap:2px}
.nav{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:9px;border:0;background:none;color:var(--muted);text-align:left;cursor:pointer;font-size:14px;width:100%}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav:hover{background:var(--card);color:var(--fg)}
.nav[aria-current="page"]{background:var(--card);color:var(--fg);box-shadow:inset 2px 0 0 var(--purple)}
.nav .soon{margin-left:auto;font:500 9.5px var(--mono);color:var(--muted);border:1px solid var(--line);padding:1px 6px;border-radius:99px}
.navgap{height:1px;background:var(--line);margin:8px 6px}
.collapsed .brand div,.collapsed .nav span,.collapsed .nav .soon,.collapsed .plan{display:none}
.collapsed .nav{justify-content:center}
.plan{margin-top:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px}
.plan .row{display:flex;justify-content:space-between;font-size:13px}
.meter{height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--grad);width:0}
/* main */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(11,11,18,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.iconbtn{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--bg2);cursor:pointer;flex:none}
.iconbtn svg{width:18px;height:18px;stroke:var(--fg);fill:none;stroke-width:1.8;stroke-linecap:round}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:0 12px;height:38px;min-width:0}
.search input{background:none;border:0;outline:0;width:100%;min-width:0}
.search input::placeholder{color:var(--muted)}
.topright{margin-left:auto;display:flex;align-items:center;gap:10px}
.toggle{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
.toggle input{accent-color:var(--purple)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font:600 13px var(--display)}
.wrap{padding-block:28px 60px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:grid;gap:28px;max-width:1240px;width:100%}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:clamp(24px,3vw,32px);font-weight:600;letter-spacing:-.01em}
h2{font-size:17px;font-weight:600}
.sub{color:var(--muted);margin:4px 0 0}
.eyebrow{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:#3d3d58}
.btn.primary{background:var(--grad);border:0;color:#fff;box-shadow:0 6px 24px rgba(120,86,255,.3)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
/* hero create panel */
.create{position:relative;overflow:hidden;background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:28px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center}
.create::after{content:"";position:absolute;right:-120px;top:-160px;width:420px;height:420px;background:radial-gradient(circle,rgba(120,86,255,.28),transparent 60%);pointer-events:none}
.create .glyph{width:150px;height:150px;border-radius:24px;position:relative;z-index:1}
.urlrow{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.field{flex:1;min-width:220px;display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:0 14px;height:46px}
.field:focus-within{border-color:var(--purple)}
.field input{background:none;border:0;outline:0;width:100%;min-width:0}
.field svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:1.8;flex:none}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:13px;cursor:pointer;color:var(--fg)}
.chip:hover{border-color:var(--purple)}
.chip svg{width:15px;height:15px;stroke:var(--blue);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.chip .soon{font:500 9.5px var(--mono);color:var(--muted)}
.msg{font-size:13px;margin-top:8px;min-height:20px}
.msg.err{color:var(--err)}
/* stats */
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--bg2)}
.stat{padding:16px 18px;border-left:1px solid var(--line);display:grid;gap:4px}
.stat:first-child{border-left:0}
.stat dt{font-size:12px;color:var(--muted)}
.stat dd{margin:0;font:600 22px var(--display);font-variant-numeric:tabular-nums}
.stat dd small{font:500 12px var(--body);color:var(--muted)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 12px;margin-bottom:14px}
.link{background:none;border:0;color:var(--blue);cursor:pointer;font-size:13px;padding:0}
/* projects */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.proj{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.thumb{aspect-ratio:16/9;max-width:100%;position:relative;display:grid;place-items:center}
.thumb .dur{position:absolute;right:8px;bottom:8px;font:500 11px var(--mono);background:rgba(0,0,0,.6);padding:2px 6px;border-radius:5px}
.thumb svg{width:34px;height:34px;fill:rgba(255,255,255,.85)}
.proj .body{padding:12px 14px 14px;display:grid;gap:10px}
.proj h3{font:600 14px var(--body)}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;font:500 11px var(--mono);padding:3px 8px;border-radius:99px;border:1px solid}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-ready{color:var(--ok);border-color:rgba(34,197,94,.35)}
.s-processing{color:var(--blue);border-color:rgba(54,200,255,.35)}
.s-failed{color:var(--err);border-color:rgba(239,68,68,.35)}
.s-draft{color:var(--muted);border-color:var(--line)}
.s-queued{color:var(--warn);border-color:rgba(245,158,11,.35)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:36px 24px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}
.empty svg{width:40px;height:40px;stroke:var(--purple);fill:none;stroke-width:1.5}
.empty strong{color:var(--fg);font-family:var(--display);font-weight:600}
/* activity */
.feed{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:6px 16px}
.feed li{display:grid;grid-template-columns:10px 1fr auto;gap:12px;align-items:baseline;padding:12px 0;border-top:1px solid var(--line);font-size:13.5px}
.feed li:first-child{border-top:0}
.feed ul{list-style:none;margin:0;padding:0}
.dot{width:8px;height:8px;border-radius:50%;transform:translateY(-1px)}
.feed time{font:500 11px var(--mono);color:var(--muted);white-space:nowrap}
.feed p{margin:0}
.feed p span{color:var(--muted);display:block;font-size:12px}
.badge-ex{font:500 10px var(--mono);letter-spacing:.08em;color:var(--warn);border:1px solid rgba(245,158,11,.4);padding:2px 7px;border-radius:99px}
/* clipper */
.steps{display:flex;gap:6px;flex-wrap:wrap;font:500 12px var(--mono);color:var(--muted)}
.steps span{padding:5px 10px;border-radius:99px;border:1px solid var(--line)}
.steps span.on{color:var(--fg);border-color:var(--purple);background:rgba(120,86,255,.12)}
.drop{border:1.5px dashed #3d3d58;border-radius:16px;background:var(--bg2);padding:40px 20px;text-align:center;display:grid;gap:10px;justify-items:center;cursor:pointer;transition:border-color .15s}
.drop.over,.drop:hover{border-color:var(--purple)}
.drop svg{width:44px;height:44px;stroke:var(--blue);fill:none;stroke-width:1.5}
.fileinfo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.fileinfo div{background:var(--card);padding:12px 14px;min-width:0}
.fileinfo dt{font-size:11.5px;color:var(--muted)}
.fileinfo dd{margin:2px 0 0;font:500 13px var(--mono);overflow-wrap:anywhere}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.form label{display:grid;gap:6px;font-size:12.5px;color:var(--muted)}
.form select{height:42px;border-radius:9px;border:1px solid var(--line);background:var(--bg);padding:0 10px}
.form .check{display:flex;align-items:center;gap:10px;color:var(--fg);font-size:14px;align-self:end;height:42px}
.form .check input{accent-color:var(--purple);width:18px;height:18px}
.notice{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r);background:rgba(54,200,255,.07);border:1px solid rgba(54,200,255,.25);font-size:13.5px}
.notice svg{width:18px;height:18px;stroke:var(--blue);fill:none;stroke-width:1.8;flex:none;margin-top:2px}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--muted)}
.consent input{accent-color:var(--purple);margin-top:3px}
.phase{background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:40px 28px;display:grid;gap:14px;max-width:640px}
.phase ul{margin:0;padding-left:18px;color:var(--muted);display:grid;gap:4px}
.scrim{display:none}
@media (max-width:1080px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.stat:nth-child(4){border-left:0}.stat:nth-child(n+4){border-top:1px solid var(--line)}.cols{grid-template-columns:1fr}}
@media (max-width:760px){
  .app,.app.collapsed{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:270px;z-index:20;transform:translateX(-100%);transition:transform .2s;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-left:max(12px,env(safe-area-inset-left,0px))}
  .app.open .side{transform:none}
  .app.open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:15}
  .collapsed .brand div,.collapsed .nav span,.collapsed .nav .soon,.collapsed .plan{display:revert}
  .top,.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .search{display:none}
  .toggle span{display:none}
  .create{grid-template-columns:1fr;padding:22px}
  .create .glyph{display:none}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat{border-left:1px solid var(--line)!important;border-top:1px solid var(--line)}
  .stat:nth-child(odd){border-left:0!important}.stat:nth-child(-n+2){border-top:0}
  .fileinfo{grid-template-columns:repeat(2,minmax(0,1fr))}
  .urlrow .btn{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Live processing + results */
.banner{margin:16px max(24px,env(safe-area-inset-right,0px)) 0 max(24px,env(safe-area-inset-left,0px));max-width:1192px}
.notice.warn{background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.35)}
.notice.warn svg{stroke:var(--warn)}
.notice.bad{background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.35)}
.notice.bad svg{stroke:var(--err)}
.yt{display:grid;grid-template-columns:200px minmax(0,1fr);gap:16px;margin-top:16px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:14px;position:relative;z-index:1}
.yt img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:var(--card)}
.yt h3{font:600 15px var(--body);margin:0 0 4px}
.yt p{margin:6px 0 0;font-size:13px;color:var(--muted)}
.yt .ok{color:var(--ok)}.yt .no{color:var(--err)}
.timeline{list-style:none;margin:0;padding:18px 20px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);display:grid;gap:2px}
.timeline li{display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:center;padding:7px 0;font-size:14px;color:var(--muted)}
.timeline .mark{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.timeline .done{color:var(--fg)}
.timeline .done .mark{background:var(--ok);border-color:var(--ok)}
.timeline .now{color:var(--fg);font-weight:600}
.timeline .now .mark{border-color:var(--blue);border-top-color:transparent;animation:spin .9s linear infinite}
.timeline .fail{color:var(--err);font-weight:600}
.timeline .fail .mark{background:var(--err);border-color:var(--err)}
.timeline small{font:500 11.5px var(--mono);color:var(--muted)}
@keyframes spin{to{transform:rotate(360deg)}}
.upbar{height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.upbar i{display:block;height:100%;background:var(--grad);width:0;transition:width .2s}
.clips{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.clip{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.clip video{width:100%;max-width:100%;max-height:75vh;object-fit:contain;background:#000;display:block}
.clip video.r916{aspect-ratio:9/16}.clip video.r11{aspect-ratio:1/1}.clip video.r169{aspect-ratio:16/9}
.clip .body{padding:14px;display:grid;gap:10px;flex:1}
.clip h3{font:600 15px var(--body);margin:0}
.clip .why{font-size:13px;color:var(--muted);margin:0}
.clip .hook{font-size:13px;margin:0;border-left:2px solid var(--purple);padding-left:10px;color:var(--fg)}
.score{display:flex;align-items:center;gap:10px;font:600 13px var(--mono)}
.score .bar{flex:1;height:5px;border-radius:9px;background:var(--line);overflow:hidden}
.score .bar i{display:block;height:100%;background:var(--grad)}
.clip .actions{display:flex;gap:8px;margin-top:auto}
.clip .actions .btn{flex:1;height:38px;font-size:13.5px;text-decoration:none}
.tiny{font:500 11px var(--mono);color:var(--muted)}
.keyform{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
@media (max-width:760px){.yt{grid-template-columns:1fr}.banner{margin-inline:16px}}
</style>
</head>
